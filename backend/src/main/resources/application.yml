server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  application:
    name: empleord-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/empleord}
    username: ${DATABASE_USER:empleord}
    password: ${DATABASE_PASSWORD:empleord}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 32
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-empleord-jwt-secret-32}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8088}
  storage:
    location: ${STORAGE_PATH:./data/uploads}
    signing-secret: ${FILE_SIGNING_SECRET:dev-only-change-me-file-signing-secret}
  mail:
    from: ${MAIL_FROM:noreply@empleord.do}
    enabled: ${MAIL_ENABLED:false}
    log-links: ${MAIL_LOG_LINKS:false}
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  api-public-url: ${API_PUBLIC_URL:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  job-default-days: ${JOB_DEFAULT_DAYS:30}
  production: ${APP_PRODUCTION:false}
  paypal:
    enabled: ${PAYPAL_ENABLED:false}
    mode: ${PAYPAL_MODE:sandbox}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
