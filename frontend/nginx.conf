worker_processes auto;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    sendfile on;
    client_max_body_size 6m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_user_agent $social_crawler {
        default 0;
        "~*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|Slackbot|TelegramBot|Discordbot|Pinterest)" 1;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /sitemap.xml {
            proxy_pass http://api:8080;
        }

        location = /robots.txt {
            proxy_pass http://api:8080;
        }

        location = /ads.txt {
            proxy_pass http://api:8080;
        }

        location /public/ {
            proxy_pass http://api:8080;
        }

        location /swagger-ui {
            proxy_pass http://api:8080;
        }

        location /v3/api-docs {
            proxy_pass http://api:8080;
        }

        location ~ ^/empleos/([^/]+)/?$ {
            error_page 418 = @spa;
            if ($social_crawler = 0) {
                return 418;
            }
            rewrite ^/empleos/([^/]+)/?$ /public/share/jobs/$1 break;
            proxy_pass http://api:8080;
        }

        location ~ ^/empresas/([^/]+)/?$ {
            error_page 418 = @spa;
            if ($social_crawler = 0) {
                return 418;
            }
            rewrite ^/empresas/([^/]+)/?$ /public/share/companies/$1 break;
            proxy_pass http://api:8080;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location @spa {
            root /usr/share/nginx/html;
            rewrite ^ /index.html break;
        }
    }
}
