<form class="wrap grid max-w-3xl gap-3 py-8" [formGroup]="form" (ngSubmit)="submit()">
  <a routerLink="/empresa/ofertas">Volver a ofertas</a>
  <h1 class="text-4xl">{{ editing() ? 'Editar oferta' : 'Publicar oferta' }}</h1>
  <p class="text-muted">Escribe el salario solo si la empresa lo va a mostrar. No completes cifras estimadas.</p>
  @if (error()) { <p class="alert" role="alert">{{ error() }}</p> }
  <label class="field"><span>Cargo</span><input formControlName="title"></label>
  <label class="field"><span>Descripción</span><textarea rows="5" formControlName="description"></textarea></label>
  <label class="field"><span>Responsabilidades</span><textarea rows="4" formControlName="responsibilities"></textarea></label>
  <label class="field"><span>Requisitos</span><textarea rows="4" formControlName="requirements"></textarea></label>
  <label class="field"><span>Categoría</span><select formControlName="categoryId"><option value="">Selecciona</option>@for (item of categories(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }</select></label>
  <div class="grid gap-3 sm:grid-cols-2">
    <label class="field"><span>Contrato</span><select formControlName="contractType"><option value="INDEFINITE">Indefinido</option><option value="TEMPORARY">Temporal</option><option value="PROJECT">Por proyecto</option><option value="INTERNSHIP">Pasantía</option><option value="FREELANCE">Freelance</option></select></label>
    <label class="field"><span>Modalidad</span><select formControlName="workMode"><option value="ONSITE">Presencial</option><option value="HYBRID">Híbrida</option><option value="REMOTE">Remota</option></select></label>
    <label class="field"><span>Jornada</span><select formControlName="workSchedule"><option value="FULL_TIME">Tiempo completo</option><option value="PART_TIME">Medio tiempo</option><option value="TEMPORARY">Temporal</option><option value="HOURLY">Por horas</option></select></label>
    <label class="field"><span>Experiencia</span><select formControlName="experienceLevel"><option value="NONE">Sin experiencia</option><option value="JUNIOR">Junior</option><option value="MID">Intermedio</option><option value="SENIOR">Senior</option><option value="LEAD">Liderazgo</option></select></label>
  </div>
  <div class="grid gap-3 sm:grid-cols-2">
    <label class="field"><span>País del empleo</span><select formControlName="countryCode">@for (country of countries(); track country.code) { <option [value]="country.code">{{ country.name }}</option> }</select></label>
    <label class="field"><span>Alcance</span><select formControlName="remoteScope"><option value="ONSITE_ONLY">Presencial</option><option value="NATIONAL">República Dominicana</option><option value="INTERNATIONAL">Internacional</option></select></label>
    <label class="field"><span>Provincia</span><select formControlName="provinceId" (change)="onProvince()"><option value="">No aplica</option>@for (item of provinces(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }</select></label>
    <label class="field"><span>Municipio</span><select formControlName="municipalityId"><option value="">No aplica</option>@for (item of municipalities(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }</select></label>
  </div>
  <label class="field"><span>Ciudad o sede, si no está en el catálogo</span><input formControlName="locationLabel"></label>
  <label class="field"><span>Restricción geográfica</span><input formControlName="geographicRestriction" placeholder="Ej. solo residentes en República Dominicana"></label>
  <div class="grid gap-3 sm:grid-cols-3">
    <label class="field"><span>Salario mínimo</span><input type="number" min="0" formControlName="salaryMin"></label>
    <label class="field"><span>Salario máximo</span><input type="number" min="0" formControlName="salaryMax"></label>
    <label class="field"><span>Moneda</span><input formControlName="salaryCurrency" maxlength="3"></label>
    <label class="field"><span>Frecuencia</span><select formControlName="salaryPeriod"><option value="HOUR">Por hora</option><option value="DAY">Por día</option><option value="WEEK">Por semana</option><option value="BIWEEKLY">Quincenal</option><option value="MONTH">Mensual</option><option value="YEAR">Anual</option></select></label>
    <label class="field"><span>Vence</span><input type="datetime-local" formControlName="expiresAt"></label>
  </div>
  <label class="flex gap-2"><input type="checkbox" formControlName="salaryNegotiable"> Salario negociable</label>
  <label class="flex gap-2"><input type="checkbox" formControlName="acceptsNoExperience"> Acepta personas sin experiencia</label>
  <fieldset><legend class="font-bold">Habilidades</legend><div class="mt-2 flex flex-wrap gap-2">
    @for (skill of skills(); track skill.id) {
      <label class="chip"><input class="mr-1" type="checkbox" [checked]="form.controls.skillIds.value.includes(skill.id)" (change)="toggleSkill(skill.id, $any($event.target).checked)">{{ skill.name }}</label>
    }
  </div></fieldset>
  <label class="flex gap-2"><input type="checkbox" formControlName="publish"> Publicar ahora</label>
  <button class="btn btn-primary w-fit" type="submit">Guardar oferta</button>
</form>
